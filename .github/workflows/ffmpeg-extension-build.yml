name: Build FFmpeg Audio Decoder Extension

# Manually triggered, deliberately separate from the main app build workflow.
# Goal: prove the Media3 1.11.0 FFmpeg extension actually compiles for
# arm64-v8a with the specific decoders we need (ac3, eac3, dca/DTS-core,
# flac, opus, vorbis, alac) BEFORE touching the app's player integration at
# all. If this fails, the main app build is completely unaffected.
#
# On success, the compiled module (source + the prebuilt FFmpeg static
# libraries — NOT the raw multi-hundred-MB FFmpeg source tree) is committed
# back into this repo under native/decoder_ffmpeg/, since this workflow's
# own GITHUB_TOKEN can write to the repo directly — that's the only
# practical way to get the build output out of a fresh CI runner and into
# a form the main app build can actually use.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ffmpeg-extension:
    runs-on: ubuntu-latest
    # FFmpeg compiles from source — this genuinely takes a while even for a
    # minimal decoder set, so give it real headroom instead of hitting a
    # default timeout partway through.
    timeout-minutes: 90

    steps:
      - name: Checkout androidx/media at the Media3 1.11.0 tag
        uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: "1.11.0"
          path: media3-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android NDK r26b
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" --sdk_root=${ANDROID_HOME}
          echo "NDK_PATH=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build git

      - name: Fetch FFmpeg source (release/6.0, shallow)
        run: |
          FFMPEG_MODULE_PATH="${GITHUB_WORKSPACE}/media3-source/libraries/decoder_ffmpeg/src/main"
          echo "FFMPEG_MODULE_PATH=${FFMPEG_MODULE_PATH}" >> "$GITHUB_ENV"
          cd "${FFMPEG_MODULE_PATH}/jni"
          git clone https://github.com/FFmpeg/FFmpeg.git --branch=release/6.0 --depth=1 ffmpeg

      - name: Build FFmpeg for arm64-v8a with the required audio decoders only
        run: |
          cd "${FFMPEG_MODULE_PATH}/jni"
          chmod +x build_ffmpeg.sh
          # Minimal decoder set — audio-only, no video/muxer/network code —
          # keeps the resulting .so small and avoids unnecessary APK bloat.
          # ac3/eac3/dca (DTS Core) are the whole point of this phase;
          # flac/opus/vorbis/alac round out broad local-file compatibility
          # for devices/builds where the platform codec is missing.
          ./build_ffmpeg.sh \
            "${FFMPEG_MODULE_PATH}" \
            "${NDK_PATH}" \
            "linux-x86_64" \
            26 \
            ac3 eac3 dca flac opus vorbis alac

      - name: Diagnose FFmpeg build output location
        if: always()
        run: |
          {
            echo "### FFmpeg build diagnostic"
            echo ""
            echo "Full tree under decoder_ffmpeg/src/main/jni (first 200 entries):"
            echo '```'
            find "${FFMPEG_MODULE_PATH}/jni" -maxdepth 4 | head -200
            echo '```'
            echo ""
            echo "Any .a static libraries anywhere under the module:"
            echo '```'
            find "${FFMPEG_MODULE_PATH}" -name "*.a" 2>/dev/null | head -100
            echo '```'
            echo ""
            echo "Any .so shared libraries anywhere under the module:"
            echo '```'
            find "${FFMPEG_MODULE_PATH}" -name "*.so" 2>/dev/null | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the FFmpeg decoder library was actually produced
        run: |
          echo "Looking for any built FFmpeg static library output..."
          FOUND=$(find "${FFMPEG_MODULE_PATH}" \( -name "*.a" -o -name "*.so" \) 2>/dev/null | head -20)
          if [ -z "$FOUND" ]; then
            echo "FAILED: no FFmpeg .a/.so build output found anywhere under the module. See the 'Diagnose FFmpeg build output location' step summary for the full directory tree."
            exit 1
          fi
          echo "Found build output:"
          echo "$FOUND"

      - name: Upload built FFmpeg module directory as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-decoder-build-output
          path: |
            ${{ env.FFMPEG_MODULE_PATH }}/jni
          retention-days: 14
          if-no-files-found: warn

      - name: Checkout this app's repo
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: Package and commit only the compiled output (not the raw FFmpeg source tree)
        run: |
          # Write directly into the app's actual module layout
          # (decoder-ffmpeg/src/main/jni/ffmpeg/...) so no manual
          # restructuring is needed after this workflow runs.
          MODULE_JNI="${GITHUB_WORKSPACE}/app-repo/decoder-ffmpeg/src/main/jni"
          rm -rf "$MODULE_JNI/ffmpeg"
          mkdir -p "$MODULE_JNI/ffmpeg/android-libs"

          # 1) Compiled static libraries, one subfolder per ABI — this is
          #    what CMakeLists.txt actually links against.
          cd "${FFMPEG_MODULE_PATH}/jni/ffmpeg"
          while IFS= read -r -d '' f; do
            rel="${f#./android-libs/}"
            mkdir -p "$MODULE_JNI/ffmpeg/android-libs/$(dirname "$rel")"
            cp "$f" "$MODULE_JNI/ffmpeg/android-libs/$rel"
          done < <(find ./android-libs -name "*.a" -print0)

          # 2) Real FFmpeg headers (libavcodec/avcodec.h etc.) that
          #    ffmpeg_jni.cc #includes to compile against — small text
          #    files only, NOT the compiled/object-file source tree.
          for libdir in libavcodec libavutil libswresample; do
            if [ -d "$libdir" ]; then
              find "$libdir" -name "*.h" -exec bash -c '
                for f; do
                  mkdir -p "'"$MODULE_JNI"'/ffmpeg/$(dirname "$f")"
                  cp "$f" "'"$MODULE_JNI"'/ffmpeg/$f"
                done
              ' bash {} +
            fi
          done
          cd "${GITHUB_WORKSPACE}"

          echo "Captured module tree:"
          find "$MODULE_JNI/ffmpeg" -maxdepth 3 | tee "$MODULE_JNI/ffmpeg/../MANIFEST.txt"

          cd "${GITHUB_WORKSPACE}/app-repo"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add decoder-ffmpeg/src/main/jni/ffmpeg decoder-ffmpeg/src/main/jni/MANIFEST.txt
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "FFmpeg decoder: add compiled static libs + real headers (ac3/eac3/dca/flac/opus/vorbis/alac, all ABIs) — built by the ffmpeg-extension-build workflow"
            git push origin HEAD:main
          fi
